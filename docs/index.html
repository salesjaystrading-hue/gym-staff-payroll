<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Staff & Payroll</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
:root{--bg:#fafafa;--fg:#18181b;--card:#fff;--bd:#e4e4e7;--mut:#71717a;--pri:#047857;--pri2:#065f46;--err:#dc2626;--warn:#b45309;--hov:#f4f4f5}
@media(prefers-color-scheme:dark){:root{--bg:#09090b;--fg:#f4f4f5;--card:#18181b;--bd:#3f3f46;--mut:#a1a1aa;--pri:#059669;--pri2:#047857;--warn:#fbbf24;--hov:#27272a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.layout{display:flex;gap:24px}
nav#nav{width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
nav#nav a{padding:8px 12px;border-radius:8px;color:inherit;text-decoration:none}
nav#nav a:hover{background:var(--hov)}
nav#nav a.on{background:var(--pri);color:#fff}
main#main{flex:1;min-width:0}
.card{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px}
.card.flush{padding:0;overflow-x:auto}
h1{font-size:18px;margin:0 0 12px}h2{font-size:14px;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.form{display:grid;gap:12px;grid-template-columns:1fr 1fr;max-width:640px}.form .full{grid-column:1/-1}
.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label.l{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.input{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:inherit;font:inherit}
.input:focus{outline:2px solid var(--pri);outline-offset:-1px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:8px;border:0;background:var(--pri);color:#fff;font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--pri2)}.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:inherit;border:1px solid var(--bd)}.btn.ghost:hover{background:var(--hov)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:8px 12px;font-weight:500}
td{padding:8px 12px;border-top:1px solid var(--bd);vertical-align:top}
.mut{color:var(--mut)}.small{font-size:12px}.err{color:var(--err)}.ok{color:var(--pri)}.warn{color:var(--warn)}
.num{font-size:24px;font-weight:600}
.right{text-align:right}.cap{text-transform:capitalize}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;max-width:90%}
#toast div{padding:10px 14px;border-radius:8px;background:var(--fg);color:var(--bg);margin-bottom:6px;box-shadow:0 4px 12px #0003}
#toast div.bad{background:var(--err);color:#fff}
.login{max-width:360px;margin:12vh auto;padding:16px}
.center{text-align:center}.big{font-size:42px}
.reg td,.reg th{padding:6px 3px;text-align:center;font-size:12px}.reg td:first-child,.reg th:first-child{text-align:left;padding-left:12px;white-space:nowrap}
details summary{cursor:pointer;color:var(--pri);font-size:12px;text-decoration:underline}
@media(max-width:760px){
 .layout{flex-direction:column;gap:8px}
 nav#nav{width:auto;flex-direction:row;overflow-x:auto;padding-bottom:6px}
 nav#nav a{white-space:nowrap;border-radius:99px;background:var(--hov);font-size:12px;padding:6px 12px}
 body.staff nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--bd);padding:0;gap:0}
 body.staff nav#nav a{flex:1;text-align:center;border-radius:0;background:transparent;padding:14px 2px}
 body.staff nav#nav a.on{background:transparent;color:var(--pri);font-weight:600}
 body.staff .wrap{padding-bottom:80px}
 .form,.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.g6{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
const SUPABASE_URL = "https://ygoyqwpvhevkfwbtjmzt.supabase.co";
const SUPABASE_KEY = "sb_publishable_pVcqL8P9qXq7MIZ6Bd2HGA_rtcgvwV4"; // publishable key: safe to be public, data is protected by database rules
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- small helpers ---------- */
const $ = (s, e = document) => e.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const IST = 5.5 * 3600e3;
const todayIST = () => new Date(Date.now() + IST).toISOString().slice(0, 10);
const monthIST = () => todayIST().slice(0, 7);
const timeIST = (t) => (t ? new Date(t).toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit" }) : "–");
const hhmm = (t) => (t ? new Date(new Date(t).getTime() + IST).toISOString().slice(11, 16) : "");
const monthLabel = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en-IN", { timeZone: "UTC", month: "long", year: "numeric" });
const dim = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
const label = (s) => String(s || "").replace("_", " ");
const v = (fd, k) => String(fd.get(k) ?? "").trim() || null;
const s = (fd, k) => String(fd.get(k) ?? "").trim();
const opt = (val, text, sel) => `<option value="${esc(val)}"${sel ? " selected" : ""}>${esc(text)}</option>`;
const field = (lbl, inner, cls = "") => `<div class="${cls}"><label class="l">${esc(lbl)}</label>${inner}</div>`;
const inp = (name, o = {}) =>
  `<input class="input" name="${name}" ${Object.entries(o).map(([k, val]) => (val === true ? k : val === false || val == null ? "" : `${k}="${esc(val)}"`)).join(" ")}>`;
const sel = (name, options, cur, extra = "") => `<select class="input" name="${name}" ${extra}>${options.map(([a, b]) => opt(a, b, String(a) === String(cur))).join("")}</select>`;
const q = async (p) => { const r = await p; if (r.error) throw r.error; return r.data; };
/** Like q() for updates/deletes: also fails when row-level security silently matched nothing. */
const mut = async (p) => { const d = await q(p); if (Array.isArray(d) && !d.length) throw new Error("You do not have permission to do that"); return d; };
const count = async (p) => { const r = await p; if (r.error) throw r.error; return r.count || 0; };
const go = (path) => { location.hash = "#" + path; };
const toast = (msg, bad) => {
  const el = document.createElement("div"); if (bad) el.className = "bad"; el.textContent = msg;
  $("#toast").appendChild(el); setTimeout(() => el.remove(), bad ? 6000 : 2500);
};
const errMsg = (e) => (e && (e.message || e.details)) || String(e);

/* ---------- state ---------- */
const S = { user: null, profile: null, perms: {} };
let timers = [];
const PERMS = [
  ["can_manage_employees", "Add and edit employees"], ["can_view_salaries", "View salaries"],
  ["can_configure_salary", "Set salaries and salary rules"], ["can_edit_attendance", "Edit attendance"],
  ["can_approve_leave", "Approve leave"], ["can_approve_payroll", "Approve payroll"],
];
const ROLE = { admin: "Admin", gym_manager: "Gym manager", staff: "Staff" };
const isStaff = () => S.profile.role === "staff";
const isAdmin = () => S.profile.role === "admin";

async function loadSession() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { S.user = null; return false; }
  S.user = data.session.user;
  const prof = await sb.from("profiles").select("id, full_name, role, is_active").eq("id", S.user.id).maybeSingle();
  if (!prof.data || !prof.data.is_active) { await sb.auth.signOut(); S.user = null; toast("This account is inactive", true); return false; }
  S.profile = prof.data;
  const all = Object.fromEntries(PERMS.map(([k]) => [k, false]));
  if (S.profile.role === "admin") PERMS.forEach(([k]) => (all[k] = true));
  if (S.profile.role === "gym_manager") {
    const mp = await sb.from("manager_permissions").select("*").eq("user_id", S.user.id).maybeSingle();
    if (mp.data) PERMS.forEach(([k]) => (all[k] = !!mp.data[k]));
  }
  S.perms = all;
  return true;
}

function menu() {
  const r = S.profile.role, p = S.perms;
  if (r === "staff") return [["/dashboard", "Home"], ["/attendance", "Attendance"], ["/leave", "Leave"], ["/salary", "Salary"], ["/profile", "Profile"]];
  const m = [["/dashboard", "Dashboard"], ["/gyms", r === "admin" ? "Gyms" : "My gyms"], ["/employees", "Employees"], ["/attendance", "Attendance"], ["/leave", "Leave"]];
  if (p.can_approve_payroll || p.can_view_salaries) m.push(["/payroll", "Payroll"]);
  if (p.can_configure_salary || p.can_approve_payroll) m.push(["/advances", "Advances & bonus"]);
  if (r === "admin") m.push(["/users", "Users & permissions"]);
  return m;
}

/* ---------- shell and routing ---------- */
function renderLogin(note) {
  document.body.classList.remove("staff");
  $("#app").innerHTML = `<div class="login"><h1>Gym Staff & Payroll</h1>
  <form class="card" data-submit="signIn" style="display:grid;gap:12px">
    ${field("Email", inp("email", { type: "email", required: true, autocomplete: "username" }))}
    ${field("Password", inp("password", { type: "password", required: true, autocomplete: "current-password" }))}
    <p class="err small" id="loginErr">${esc(note || "")}</p>
    <button class="btn">Sign in</button></form></div>`;
}

function renderShell() {
  document.body.classList.toggle("staff", isStaff());
  $("#app").innerHTML = `<div class="wrap"><header class="top"><div><b>Gym Staff & Payroll</b><div class="small mut">${esc(S.profile.full_name)} · ${ROLE[S.profile.role]}</div></div>
  <button class="btn ghost" data-click="signOut">Sign out</button></header>
  <div class="layout"><nav id="nav"></nav><main id="main"></main></div></div>`;
}

function renderNav(path) {
  $("#nav").innerHTML = menu().map(([h, t]) => `<a href="#${h}" class="${path === h || (h !== "/dashboard" && path.startsWith(h)) ? "on" : ""}">${esc(t)}</a>`).join("");
}

const routes = [];
const R = (re, fn) => routes.push([re, fn]);

async function route() {
  timers.forEach(clearInterval); timers = [];
  if (!S.user) return renderLogin();
  const [pathRaw, qs] = (location.hash.slice(1) || "/dashboard").split("?");
  const path = pathRaw || "/dashboard";
  const query = Object.fromEntries(new URLSearchParams(qs || ""));
  if (!$("#main")) renderShell();
  renderNav(path);
  const main = $("#main");
  for (const [re, fn] of routes) {
    const m = path.match(re);
    if (!m) continue;
    main.innerHTML = `<p class="mut">Loading…</p>`;
    try {
      const out = await fn(m.slice(1), query);
      if (location.hash.slice(1).split("?")[0] !== path && location.hash) { /* navigated away while loading */ }
      if (typeof out === "string") main.innerHTML = out;
      else if (out) { main.innerHTML = out.html; if (out.after) out.after(); }
    } catch (e) { main.innerHTML = `<div class="card err">Something went wrong: ${esc(errMsg(e))}</div>`; }
    return;
  }
  main.innerHTML = `<div class="card">Page not found. <a href="#/dashboard">Go home</a></div>`;
}

/* ---------- event wiring ---------- */
const H = {}; // action handlers
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("form[data-submit]"); if (!f) return;
  e.preventDefault();
  const btns = [...f.querySelectorAll("button")]; btns.forEach((b) => (b.disabled = true));
  try { await H[f.dataset.submit](new FormData(f), f, e.submitter); }
  catch (err) { toast(errMsg(err), true); const le = $("#loginErr"); if (le && f.dataset.submit === "signIn") le.textContent = errMsg(err); }
  finally { btns.forEach((b) => (b.disabled = false)); }
});
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-click]"); if (!b) return;
  try { await H[b.dataset.click](b.dataset, b); } catch (err) { toast(errMsg(err), true); }
});
window.addEventListener("hashchange", route);

H.filter = (fd, f) => { const p = new URLSearchParams(); for (const [k, val] of fd) if (val !== "") p.set(k, val); go(f.dataset.path + "?" + p); };
H.signIn = async (fd) => {
  const { error } = await sb.auth.signInWithPassword({ email: s(fd, "email"), password: s(fd, "password") });
  if (error) throw new Error("Wrong email or password");
  if (await loadSession()) { renderShell(); if (!location.hash) go("/dashboard"); route(); } else renderLogin();
};
H.signOut = async () => { await sb.auth.signOut(); S.user = null; location.hash = ""; renderLogin(); };

/* ================= shared data helpers ================= */
const gymsList = () => q(sb.from("gyms").select("id,code,name,is_active").order("name"));
const myEmployee = async () => (await q(sb.from("employees").select("id,gym_id,full_name,employee_code,joining_date,weekly_off,shift_id,device_id,designation,phone").eq("user_id", S.user.id).maybeSingle()));
const gymPicker = (gyms, cur, path, extra = {}) =>
  `<form class="inline" data-submit="filter" data-path="${path}">
    ${Object.entries(extra).map(([k, val]) => `<input type="hidden" name="${k}" value="${esc(val)}">`).join("")}
    ${field("Gym", sel("gym", gyms.map((g) => [g.id, g.name]), cur, 'onchange="this.form.requestSubmit()"'))}
    <noscript><button class="btn">Go</button></noscript></form>`;
const monthInput = (name, cur) => inp(name, { type: "month", value: cur, onchange: "this.form.requestSubmit()" });
const STATUS = ["present", "late", "half_day", "absent", "paid_leave", "unpaid_leave", "weekly_off", "holiday"];
const CODE = { present: "P", late: "L", half_day: "H", absent: "A", paid_leave: "PL", unpaid_leave: "UL", weekly_off: "W", holiday: "HD" };
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const deviceId = () => { try { let d = localStorage.getItem("gym_device"); if (!d) { d = crypto.randomUUID(); localStorage.setItem("gym_device", d); } return d; } catch { return "nodevice-" + navigator.userAgent.length; } };
const istStamp = (date, time) => (time ? `${date}T${time}:00+05:30` : null);
const table = (head, rows, empty = "Nothing here yet.") =>
  `<div class="card flush"><table><thead><tr>${head.map((h) => `<th${h.startsWith(">") ? ' class="right"' : ""}>${esc(h.replace(/^>/, ""))}</th>`).join("")}</tr></thead><tbody>${rows.length ? rows.join("") : `<tr><td colspan="${head.length}" class="mut">${esc(empty)}</td></tr>`}</tbody></table></div>`;

/* ================= dashboard ================= */
R(/^\/dashboard$/, async () => {
  if (isStaff()) {
    const e = await myEmployee();
    if (!e) return `<h1>Hello, ${esc(S.profile.full_name)}</h1><div class="card">Your login is not linked to an employee record yet. Ask your manager.</div>`;
    const today = todayIST();
    const a = await q(sb.from("attendance").select("*").eq("employee_id", e.id).eq("work_date", today).maybeSingle());
    const m = monthIST();
    const rows = await q(sb.from("attendance").select("status").eq("employee_id", e.id).gte("work_date", m + "-01").lte("work_date", m + "-" + dim(m)));
    const c = {}; rows.forEach((r) => (c[r.status] = (c[r.status] || 0) + 1));
    return `<h1>Hello, ${esc(S.profile.full_name)}</h1>
    <div class="card"><h2>Today</h2>${a ? `<p class="cap"><b>${label(a.status)}</b> · in ${timeIST(a.check_in)} · out ${timeIST(a.check_out)}</p>` : `<p class="mut">Not marked yet. Scan the QR code shown at your gym with your phone camera.</p>`}</div>
    <div class="card"><h2>${monthLabel(m + "-01")}</h2><div class="grid g3">
      ${[["present", "Present"], ["late", "Late"], ["half_day", "Half days"], ["absent", "Absent"], ["paid_leave", "Paid leave"], ["unpaid_leave", "Unpaid leave"]].map(([k, t]) => `<div><div class="num">${c[k] || 0}</div><div class="small mut">${t}</div></div>`).join("")}
    </div></div>`;
  }
  const today = todayIST(), m = monthIST() + "-01";
  const [gyms, emps, present, pend, drafts] = await Promise.all([
    count(sb.from("gyms").select("id", { count: "exact", head: true }).eq("is_active", true)),
    count(sb.from("employees").select("id", { count: "exact", head: true }).eq("is_active", true)),
    count(sb.from("attendance").select("id", { count: "exact", head: true }).eq("work_date", today).in("status", ["present", "late", "half_day"])),
    count(sb.from("leave_requests").select("id", { count: "exact", head: true }).eq("status", "pending")),
    S.perms.can_approve_payroll || S.perms.can_view_salaries ? count(sb.from("payroll_runs").select("id", { count: "exact", head: true }).eq("status", "draft")) : Promise.resolve(null),
  ]);
  const card = (n, t, href) => `<a class="card" style="text-decoration:none;color:inherit;margin:0" href="#${href}"><div class="num">${n}</div><div class="small mut">${t}</div></a>`;
  return `<h1>Dashboard</h1><div class="grid g3">
    ${card(gyms, "Active gyms", "/gyms")}${card(emps, "Active employees", "/employees")}${card(present, "Present today", "/attendance")}
    ${card(pend, "Leave requests waiting", "/leave")}${drafts == null ? "" : card(drafts, "Payroll drafts", "/payroll")}</div>`;
});

/* ================= gyms ================= */
R(/^\/gyms$/, async () => {
  const gyms = await q(sb.from("gyms").select("*").order("name"));
  return `<div class="row"><h1>${isAdmin() ? "Gyms" : "My gyms"}</h1>${isAdmin() ? `<a class="btn" href="#/gyms/new">Add gym</a>` : ""}</div>` +
    table(["Code", "Name", "Phone", "Status", ""], gyms.map((g) => `<tr><td>${esc(g.code)}</td><td>${esc(g.name)}</td><td>${esc(g.phone || "")}</td><td>${g.is_active ? "Active" : '<span class="mut">Inactive</span>'}</td><td class="right"><a href="#/gyms/${g.id}">Open</a></td></tr>`), "No gyms.");
});

const gymForm = (g = {}) => `
  ${field("Code", inp("code", { required: true, value: g.code, placeholder: "e.g. JG1" }))}
  ${field("Name", inp("name", { required: true, value: g.name }))}
  ${field("Phone", inp("phone", { value: g.phone }))}${field("Email", inp("email", { type: "email", value: g.email }))}
  ${field("Opening time", inp("opening_time", { type: "time", value: g.opening_time?.slice(0, 5) }))}${field("Closing time", inp("closing_time", { type: "time", value: g.closing_time?.slice(0, 5) }))}
  ${field("Address", inp("address", { value: g.address }), "full")}`;
const gymRow = (fd) => ({ code: s(fd, "code"), name: s(fd, "name"), phone: v(fd, "phone"), email: v(fd, "email"), address: v(fd, "address"), opening_time: v(fd, "opening_time"), closing_time: v(fd, "closing_time") });

R(/^\/gyms\/new$/, async () => {
  if (!isAdmin()) return `<div class="card">Only the admin can add gyms.</div>`;
  return `<h1>Add gym</h1><form class="form" data-submit="gymCreate">${gymForm()}<div class="full"><button class="btn">Save</button></div></form>`;
});
H.gymCreate = async (fd) => { const d = await q(sb.from("gyms").insert(gymRow(fd)).select("id").single()); toast("Gym added"); go("/gyms/" + d.id); };

R(/^\/gyms\/([0-9a-f-]{36})$/, async ([id]) => {
  const [g, st, shifts, hols] = await Promise.all([
    q(sb.from("gyms").select("*").eq("id", id).single()),
    q(sb.from("gym_settings").select("*").eq("gym_id", id).single()),
    q(sb.from("shifts").select("*").eq("gym_id", id).order("start_time")),
    q(sb.from("gym_holidays").select("*").eq("gym_id", id).gte("holiday_date", todayIST().slice(0, 4) + "-01-01").order("holiday_date")),
  ]);
  const canSal = isAdmin() || S.perms.can_configure_salary, canGym = isAdmin();
  return `<div class="row"><h1>${esc(g.name)}</h1><a class="btn ghost" href="#/attendance/qr?gym=${id}">Show QR code</a></div>
  ${canGym ? `<h2>Details</h2><form class="form card" data-submit="gymUpdate" data-id="${id}">${gymForm(g)}
    <div class="full"><label><input type="checkbox" name="is_active" ${g.is_active ? "checked" : ""}> Active</label></div>
    <div class="full"><button class="btn">Save details</button></div></form>` : ""}
  <h2>Salary rules</h2>
  ${canSal ? `<form class="form card" data-submit="settingsUpdate" data-id="${id}">
    ${field("Salary cut method", sel("deduction_method", [["daily", "Daily (per day missed)"], ["shift", "Per shift"], ["hourly", "Hourly (short hours)"]], st.deduction_method))}
    ${field("Divisor", sel("salary_divisor", [["fixed_30", "Fixed 30 days"], ["calendar_days", "Calendar days of the month"], ["working_days", "Working days"]], st.salary_divisor))}
    ${field("Late marks that make a half day (blank = off)", inp("late_marks_per_half_day", { type: "number", min: 1, value: st.late_marks_per_half_day }))}
    ${field("Late grace (minutes)", inp("late_grace_minutes", { type: "number", min: 0, value: st.late_grace_minutes }))}
    ${field("Paid leaves per month", inp("paid_leaves_per_month", { type: "number", min: 0, step: "0.5", value: st.paid_leaves_per_month }))}
    ${field("Overtime", sel("overtime_enabled", [["false", "Off"], ["true", "On"]], String(st.overtime_enabled)))}

    after() {
      const draw = async () => {
        try {
          const t = await q(sb.rpc("rotate_gym_qr", { p_gym: gid }));
          const url = location.origin + location.pathname + "#/checkin?t=" + t;
          const code = qrcode(0, "M"); code.addData(url); code.make();
          const box = $("#qrbox"); if (!box) return;
          box.innerHTML = code.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
          const sv = box.querySelector("svg"); if (sv) { sv.style.width = "min(70vw,320px)"; sv.style.height = "auto"; }
          $("#qrnote").textContent = "Updated " + new Date().toLocaleTimeString("en-IN");
        } catch (e) { const n = $("#qrnote"); if (n) n.textContent = "Could not refresh: " + errMsg(e); }
      };
      draw(); timers.push(setInterval(draw, 30000));
    },
  };
});

};
H.leaveCancel = async (d) => { await q(sb.rpc("cancel_leave", { p_id: d.id })); route(); };
H.leaveDecide = async (fd, f, btn) => {

const canPay = () => isAdmin() || S.perms.can_view_salaries || S.perms.can_approve_payroll;
R(/^\/payroll$/, async () => {

  const [gyms, runs] = await Promise.all([gymsList(), q(sb.from("payroll_runs").select("id,month,status,gyms(name)").order("month", { ascending: false }).limit(60))]);

  ${isAdmin() || S.perms.can_approve_payroll ? `<form class="inline card" data-submit="payGenerate">${field("Gym", sel("gym", gyms.filter((g) => g.is_active).map((g) => [g.id, g.name]), ""))}${field("Month", inp("month", { type: "month", required: true, value: monthIST() }))}<button class="btn">Generate / open</button></form>` : ""}` +

H.payGenerate = async (fd) => {
  const id = await q(sb.rpc("generate_payroll", { p_gym: s(fd, "gym"), p_month: s(fd, "month") + "-01" }));
  go("/payroll/" + id);
};

async function runData(id) {
  const run = await q(sb.from("payroll_runs").select("*,gyms(name)").eq("id", id).single());
  const [items, emps, adjs, pays] = await Promise.all([
    q(sb.from("payroll_item_view").select("*").eq("run_id", id)),
    q(sb.from("employees").select("id,full_name,employee_code,designation").eq("gym_id", run.gym_id)),
    q(sb.from("payroll_adjustments").select("*").eq("run_id", id).order("created_at")),
    q(sb.from("payroll_payments").select("*").order("paid_on")),
  ]);
  const en = Object.fromEntries(emps.map((e) => [e.id, e]));
  items.sort((a, b) => (en[a.employee_id]?.full_name || "").localeCompare(en[b.employee_id]?.full_name || ""));
  return { run, items, en, adjs, pays };
}

   ${!draft && canAp ? `<tr><td colspan="12"><details><summary>Pay / adjust ${esc(en[i.employee_id]?.full_name || "")}</summary>
     <form class="inline" style="margin:8px 0" data-submit="payRecord" data-item="${i.id}">${field("Amount", inp("amount", { type: "number", step: "0.01", min: 0.01, required: true, value: Math.max(0, Number(i.final_net) - Number(i.paid_amount)).toFixed(2) }))}${field("Date", inp("paid_on", { type: "date", required: true, value: todayIST() }))}${field("Method", sel("method", [["bank", "Bank"], ["upi", "UPI"], ["cash", "Cash"]], "bank"))}${field("Reference", inp("reference"))}<button class="btn">Record payment</button></form>

/* ---- salary slip PDF ---- */
async function makeSlip(item, run, emp, gymName) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdf = await PDFDocument.create(); const page = pdf.addPage([420, 560]);
  const f = await pdf.embedFont(StandardFonts.Helvetica), fb = await pdf.embedFont(StandardFonts.HelveticaBold);
  const rs = (n) => "Rs. " + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  let y = 520;
  const text = (t, x, size = 10, bold = false) => page.drawText(String(t), { x, y, size, font: bold ? fb : f, color: rgb(0.1, 0.1, 0.1) });
  const line = (a, b, bold) => { text(a, 30, 10, bold); const w = (bold ? fb : f).widthOfTextAtSize(rs(b), 10); page.drawText(rs(b), { x: 390 - w, y, size: 10, font: bold ? fb : f }); y -= 18; };
  text(gymName, 30, 16, true); y -= 20; text("Salary slip - " + monthLabel(run.month), 30, 11); y -= 26;
  text(emp.full_name + (emp.employee_code ? "  (" + emp.employee_code + ")" : ""), 30, 11, true); y -= 16;
  if (emp.designation) { text(emp.designation, 30, 9); y -= 16; }
  y -= 6; page.drawLine({ start: { x: 30, y: y + 10 }, end: { x: 390, y: y + 10 }, thickness: 0.5 }); y -= 6;
  text(`Present ${item.present_days} · Late ${item.late_count} · Absent units ${item.absent_units} · Paid leave ${item.paid_leave_days} · Unpaid leave ${item.unpaid_leave_days}`, 30, 8.5); y -= 24;
  line("Monthly salary", item.monthly_salary); line("Deduction for absence / leave", -item.deduction_amount);
  if (Number(item.overtime_amount)) line("Overtime (" + item.overtime_hours + " h)", item.overtime_amount);
  if (Number(item.incentive_amount)) line("Bonus / incentive", item.incentive_amount);
  if (Number(item.advance_recovery)) line("Advance recovery", -item.advance_recovery);
  if (Number(item.adj_earning)) line("Adjustment (added)", item.adj_earning);
  if (Number(item.adj_deduction)) line("Adjustment (deducted)", -item.adj_deduction);
  y -= 4; page.drawLine({ start: { x: 30, y: y + 12 }, end: { x: 390, y: y + 12 }, thickness: 0.5 }); y -= 4;
  line("Net salary", item.final_net, true); line("Paid so far", item.paid_amount);
  y -= 30; text("Generated " + new Date().toLocaleDateString("en-IN"), 30, 8);
  const bytes = await pdf.save(); const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  a.download = `slip-${emp.full_name.replace(/\W+/g, "_")}-${run.month.slice(0, 7)}.pdf`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
H.slip = async (d) => {
  const item = await q(sb.from("payroll_item_view").select("*").eq("id", d.id).single());
  const [run, emp] = await Promise.all([q(sb.from("payroll_runs").select("*,gyms(name)").eq("id", item.run_id).single()), q(sb.from("employees").select("full_name,employee_code,designation").eq("id", item.employee_id).single())]);
  await makeSlip(item, run, emp, run.gyms?.name || "Gym");
};

/* ================= users & permissions (admin) ================= */
async function callAdmin(body) {
  const { data, error } = await sb.functions.invoke("team-admin", { body });
  if (error) {
    let m = error.message;
    try { const j = await error.context.json(); if (j?.error) m = j.error; } catch {}
    throw new Error(m);
  }
  if (data?.error) throw new Error(data.error);
  return data;
}

  const [users, emps] = await Promise.all([q(sb.from("profiles").select("id,full_name,email,role,is_active").order("created_at")), q(sb.from("employees").select("id,full_name,employee_code,user_id").is("user_id", null).eq("is_active", true).order("full_name"))]);
  return `<h1>Users &amp; permissions</h1>
  <h2>Create a login</h2>
  <form class="form card" data-submit="userCreate">
    ${field("Full name", inp("full_name", { required: true }))}${field("Email", inp("email", { type: "email", required: true }))}
    ${field("Password (min 8)", inp("password", { type: "text", minlength: 8, required: true, autocomplete: "off" }))}
    ${field("Role", sel("role", [["staff", "Staff"], ["gym_manager", "Gym manager"]], "staff"))}
    ${field("Link to employee (for staff)", sel("employee_id", [["", "— none / link later —"], ...emps.map((e) => [e.id, `${e.full_name} (${e.employee_code})`])], ""), "full")}

});
H.userCreate = async (fd) => {
  const role = s(fd, "role"), emp = v(fd, "employee_id");
  const r = await callAdmin({ action: "create_user", email: s(fd, "email"), password: s(fd, "password"), full_name: s(fd, "full_name"), role });
  if (role === "staff" && emp) await mut(sb.from("employees").update({ user_id: r.id }).eq("id", emp).select("id"));
  toast("Login created"); go("/users/" + r.id);
};

R(/^\/users\/([0-9a-f-]{36})$/, async ([id]) => {
  if (!isAdmin()) return `<div class="card">Not allowed.</div>`;
  const u = await q(sb.from("profiles").select("*").eq("id", id).single());
  let extra = "";
  if (u.role === "gym_manager") {
    const [gyms, acc, mp] = await Promise.all([gymsList(), q(sb.from("manager_gym_access").select("gym_id").eq("user_id", id)), q(sb.from("manager_permissions").select("*").eq("user_id", id).maybeSingle())]);
    const have = new Set(acc.map((a) => a.gym_id));
    extra = `<h2>Gyms and abilities</h2><form class="card" data-submit="mgrSave" data-id="${id}"><p class="small mut">Gyms this manager can work in:</p>
      ${gyms.map((g) => `<label style="display:block"><input type="checkbox" name="gym_${g.id}" ${have.has(g.id) ? "checked" : ""}> ${esc(g.name)}</label>`).join("")}
      <p class="small mut" style="margin-top:12px">Abilities:</p>
      ${PERMS.map(([k, t]) => `<label style="display:block"><input type="checkbox" name="${k}" ${mp?.[k] ? "checked" : ""}> ${esc(t)}</label>`).join("")}
      <div style="margin-top:12px"><button class="btn">Save</button></div></form>`;
  }
  return `<div class="row"><h1>${esc(u.full_name)}</h1><a class="btn ghost" href="#/users">Back</a></div>
  <div class="card"><div>${esc(u.email || "")}</div><div class="small mut">${ROLE[u.role]} · ${u.is_active ? "Active" : "Inactive"}</div></div>
  <div class="grid g2">
   <form class="card inline" data-submit="userPassword" data-id="${id}">${field("New password (min 8)", inp("password", { minlength: 8, required: true, autocomplete: "off" }))}<button class="btn">Set password</button></form>
   ${u.id !== S.user.id ? `<div class="card"><button class="btn ghost" data-click="userToggle" data-id="${id}" data-on="${u.is_active ? 0 : 1}">${u.is_active ? "Deactivate login" : "Reactivate login"}</button></div>` : ""}
  </div>${extra}`;
});
H.userPassword = async (fd, f) => { await callAdmin({ action: "set_password", user_id: f.dataset.id, id: f.dataset.id, password: s(fd, "password") }); toast("Password changed"); f.reset(); };
H.userToggle = async (d) => { await mut(sb.from("profiles").update({ is_active: d.on === "1" }).eq("id", d.id).select("id")); route(); };
H.mgrSave = async (fd, f) => {
  const id = f.dataset.id, gyms = await gymsList();
  const want = gyms.filter((g) => fd.get("gym_" + g.id) === "on").map((g) => g.id);
  const acc = await q(sb.from("manager_gym_access").select("gym_id").eq("user_id", id)); const have = new Set(acc.map((a) => a.gym_id));
  for (const g of gyms) {
    const w = want.includes(g.id), h = have.has(g.id);
    if (w && !h) await q(sb.from("manager_gym_access").insert({ user_id: id, gym_id: g.id }));
    if (!w && h) await q(sb.from("manager_gym_access").delete().eq("user_id", id).eq("gym_id", g.id));
  }
  const perms = Object.fromEntries(PERMS.map(([k]) => [k, fd.get(k) === "on"]));
  await mut(sb.from("manager_permissions").upsert({ user_id: id, ...perms }, { onConflict: "user_id" }).select("user_id"));
  toast("Saved");
};
