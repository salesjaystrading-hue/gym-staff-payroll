<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Staff & Payroll</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
:root{--bg:#f3f6f9;--fg:#0f172a;--card:#ffffff;--bd:#e5eaf0;--mut:#64748b;--pri:#0f9d76;--pri2:#0b7a5c;--pri-soft:#e6f7f1;--acc:#f97316;--err:#dc2626;--warn:#d97706;--hov:#f1f5f9;--shadow:0 1px 2px #0f172a0d,0 4px 16px #0f172a0a;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--fg:#e8edf5;--card:#131c2e;--bd:#25314a;--mut:#93a1b8;--pri:#18b98a;--pri2:#0f9d76;--pri-soft:#10302a;--acc:#fb923c;--err:#f87171;--warn:#fbbf24;--hov:#1a2640;--shadow:0 1px 2px #0006,0 6px 20px #0004}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:220px;background:linear-gradient(135deg,#0f9d7633,#f9731622 70%,transparent);pointer-events:none;z-index:0}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px;position:relative;z-index:1}
header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#10b981,#0b7a5c);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 16px #0f9d7655}
.brand b{font-size:16px;letter-spacing:-.01em}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#ef4444);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.layout{display:flex;gap:22px;align-items:flex-start}
nav#nav{width:226px;flex-shrink:0;display:flex;flex-direction:column;gap:3px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);position:sticky;top:14px}
nav#nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:500;transition:.15s}
nav#nav a .ic{font-size:17px;width:22px;text-align:center}
nav#nav a:hover{background:var(--hov);color:var(--fg)}
nav#nav a.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 14px #0f9d7640}
main#main{flex:1;min-width:0}
.card{border:1px solid var(--bd);background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow-x:auto}
a.card{transition:.15s}a.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0f172a14}
h1{font-size:23px;margin:0 0 14px;letter-spacing:-.02em;font-weight:700}
h2:first-child,.card>h2{margin-top:0}
h2{font-size:15px;margin:22px 0 10px;font-weight:650;letter-spacing:-.01em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.row h1{margin:0}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.form{display:grid;gap:14px;grid-template-columns:1fr 1fr;max-width:680px}.form .full{grid-column:1/-1}
.form.card{max-width:none}
.inline{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label.l{display:block;font-size:12px;font-weight:550;color:var(--mut);margin-bottom:5px}
.input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:inherit;font:inherit;transition:.15s}
.input:hover{border-color:#94a3b866}
.input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px #0f9d7626}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:0 4px 12px #0f9d7638;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px #0f9d7640}.btn:active{transform:none}.btn:disabled{opacity:.5;transform:none}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--bd);box-shadow:none}.btn.ghost:hover{background:var(--hov);box-shadow:none}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:11px 14px;font-weight:600;background:var(--hov);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--bd);vertical-align:top}
tbody tr{transition:.1s}tbody tr:hover{background:var(--hov)}
.mut{color:var(--mut)}.small{font-size:12.5px}.err{color:var(--err)}.ok{color:var(--pri)}.warn{color:var(--warn)}
.num{font-size:28px;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.num.ok{background:linear-gradient(135deg,#10b981,#0b7a5c);-webkit-background-clip:text;background-clip:text;color:transparent}
.right{text-align:right}.cap{text-transform:capitalize}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;max-width:92%}
#toast div{padding:11px 16px;border-radius:12px;background:#0f172a;color:#fff;margin-bottom:8px;box-shadow:0 10px 30px #0004;font-weight:500}
#toast div.bad{background:var(--err)}
.center{text-align:center}.big{font-size:44px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-size:11.5px;font-weight:600}
.bar{height:9px;border-radius:5px;background:linear-gradient(90deg,var(--pri),#34d399)}
.reg td,.reg th{padding:7px 4px;text-align:center;font-size:12px}.reg td:first-child,.reg th:first-child{text-align:left;padding-left:14px;white-space:nowrap}
details summary{cursor:pointer;color:var(--pri);font-size:13px;font-weight:600}
a{color:var(--pri)}
/* login */
.hero{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 10% -10%,#10b98155,transparent),radial-gradient(800px 500px at 100% 110%,#f9731644,transparent),var(--bg)}
.login{width:100%;max-width:400px}
.login .logo{width:62px;height:62px;border-radius:18px;font-size:32px;margin:0 auto 14px}
.login .card{padding:24px;border-radius:20px;box-shadow:0 20px 50px #0f172a1f}
.login h1{text-align:center;font-size:25px;margin:0 0 4px}.login p.sub{text-align:center;color:var(--mut);margin:0 0 18px}
@media print{header.top,nav#nav,.btn,.actions,form.inline,#toast{display:none!important}.card{border:0;box-shadow:none}body{background:#fff;color:#000}body::before{display:none}}
@media(max-width:760px){
 .layout{flex-direction:column;gap:10px}
 nav#nav{width:100%;flex-direction:row;overflow-x:auto;padding:6px;position:static;border-radius:99px}
 nav#nav a{white-space:nowrap;border-radius:99px;font-size:13px;padding:8px 13px}
 nav#nav a .ic{font-size:15px;width:auto}
 body.staff nav#nav{position:fixed;left:10px;right:10px;bottom:10px;top:auto;z-index:10;border-radius:20px;padding:6px;gap:2px;justify-content:space-around;box-shadow:0 10px 30px #0f172a30}
 body.staff nav#nav a{flex:1;flex-direction:column;gap:1px;padding:7px 2px;font-size:11px;border-radius:14px;text-align:center}
 body.staff nav#nav a .ic{font-size:19px}
 body.staff .wrap{padding-bottom:96px}
 .form,.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.g6{grid-template-columns:1fr 1fr 1fr}
 h1{font-size:20px}.num{font-size:23px}
 .brand .small{display:none}header.top .btn{padding:7px 12px;font-size:13px}
 th,td{padding:9px 10px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
const SUPABASE_URL = "https://ygoyqwpvhevkfwbtjmzt.supabase.co";
const SUPABASE_KEY = "sb_publishable_pVcqL8P9qXq7MIZ6Bd2HGA_rtcgvwV4"; // publishable key: safe to be public, data is protected by database rules
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- small helpers ---------- */
const $ = (s, e = document) => e.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const IST = 5.5 * 3600e3;
const todayIST = () => new Date(Date.now() + IST).toISOString().slice(0, 10);
const monthIST = () => todayIST().slice(0, 7);
const timeIST = (t) => (t ? new Date(t).toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit" }) : "–");
const hhmm = (t) => (t ? new Date(new Date(t).getTime() + IST).toISOString().slice(11, 16) : "");
const monthLabel = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en-IN", { timeZone: "UTC", month: "long", year: "numeric" });
const dim = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
const label = (s) => String(s || "").replace("_", " ");
const v = (fd, k) => String(fd.get(k) ?? "").trim() || null;
const s = (fd, k) => String(fd.get(k) ?? "").trim();
const opt = (val, text, sel) => `<option value="${esc(val)}"${sel ? " selected" : ""}>${esc(text)}</option>`;
const field = (lbl, inner, cls = "") => `<div class="${cls}"><label class="l">${esc(lbl)}</label>${inner}</div>`;
const inp = (name, o = {}) =>
  `<input class="input" name="${name}" ${Object.entries(o).map(([k, val]) => (val === true ? k : val === false || val == null ? "" : `${k}="${esc(val)}"`)).join(" ")}>`;
const sel = (name, options, cur, extra = "") => `<select class="input" name="${name}" ${extra}>${options.map(([a, b]) => opt(a, b, String(a) === String(cur))).join("")}</select>`;
const q = async (p) => { const r = await p; if (r.error) throw r.error; return r.data; };
/** Like q() for updates/deletes: also fails when row-level security silently matched nothing. */
const mut = async (p) => { const d = await q(p); if (Array.isArray(d) && !d.length) throw new Error("You do not have permission to do that"); return d; };
const count = async (p) => { const r = await p; if (r.error) throw r.error; return r.count || 0; };
const go = (path) => { location.hash = "#" + path; };
const toast = (msg, bad) => {
  const el = document.createElement("div"); if (bad) el.className = "bad"; el.textContent = msg;
  $("#toast").appendChild(el); setTimeout(() => el.remove(), bad ? 6000 : 2500);
};
const errMsg = (e) => (e && (e.message || e.details)) || String(e);

/* ---------- state ---------- */
const S = { user: null, profile: null, perms: {} };
let timers = [];
const PERMS = [
  ["can_manage_employees", "Add and edit employees"], ["can_view_salaries", "View salaries"],
  ["can_configure_salary", "Set salaries and salary rules"], ["can_edit_attendance", "Edit attendance"],
  ["can_approve_leave", "Approve leave"], ["can_approve_payroll", "Approve payroll"],
];
const ROLE = { admin: "Admin", gym_manager: "Gym manager", staff: "Staff" };
const isStaff = () => S.profile.role === "staff";
const isAdmin = () => S.profile.role === "admin";

async function loadSession() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { S.user = null; return false; }
  S.user = data.session.user;
  const prof = await sb.from("profiles").select("id, full_name, role, is_active").eq("id", S.user.id).maybeSingle();
  if (!prof.data || !prof.data.is_active) { await sb.auth.signOut(); S.user = null; toast("This account is inactive", true); return false; }
  S.profile = prof.data;
  const all = Object.fromEntries(PERMS.map(([k]) => [k, false]));
  if (S.profile.role === "admin") PERMS.forEach(([k]) => (all[k] = true));
  if (S.profile.role === "gym_manager") {
    const mp = await sb.from("manager_permissions").select("*").eq("user_id", S.user.id).maybeSingle();
    if (mp.data) PERMS.forEach(([k]) => (all[k] = !!mp.data[k]));
  }
  S.perms = all;
  return true;
}

function menu() {
  const r = S.profile.role, p = S.perms;
  if (r === "staff") return [["/dashboard", "Home"], ["/attendance", "Attendance"], ["/leave", "Leave"], ["/salary", "Salary"], ["/profile", "Profile"]];
  const m = [["/dashboard", "Dashboard"], ["/gyms", r === "admin" ? "Gyms" : "My gyms"], ["/employees", "Employees"], ["/attendance", "Attendance"], ["/leave", "Leave"]];
  if (r === "admin" || p.can_edit_attendance) m.splice(4, 0, ["/roster", "Roster"]);
  if (p.can_approve_payroll || p.can_view_salaries) m.push(["/payroll", "Payroll"]);
  if (p.can_configure_salary || p.can_approve_payroll) m.push(["/advances", "Advances & bonus"]);
  m.push(["/reports", "Reports"]);
  if (r === "admin") m.push(["/users", "Users & permissions"]);
  return m;
}

/* ---------- shell and routing ---------- */
function renderLogin(note) {
  document.body.classList.remove("staff");
  $("#app").innerHTML = `<div class="hero"><div class="login"><div class="logo">🏋️</div><h1>Gym Staff &amp; Payroll</h1><p class="sub">Sign in to continue</p>
  <form class="card" data-submit="signIn" style="display:grid;gap:14px">
    ${field("Email", inp("email", { type: "email", required: true, autocomplete: "username" }))}
    ${field("Password", inp("password", { type: "password", required: true, autocomplete: "current-password" }))}
    <p class="err small" id="loginErr">${esc(note || "")}</p>
    <button class="btn">Sign in</button></form></div></div>`;
}

function renderShell() {
  document.body.classList.toggle("staff", isStaff());
  $("#app").innerHTML = `<div class="wrap"><header class="top"><div class="brand"><div class="logo">🏋️</div><div><b>Gym Staff &amp; Payroll</b><div class="small mut">${ROLE[S.profile.role]}</div></div></div>
  <div class="brand"><div class="avatar">${esc((S.profile.full_name || "?").trim()[0].toUpperCase())}</div><span class="small" style="font-weight:600">${esc(S.profile.full_name)}</span><button class="btn ghost" data-click="signOut">Sign out</button></div></header>
  <div class="layout"><nav id="nav"></nav><main id="main"></main></div></div>`;
}

function renderNav(path) {
  const IC = { "/dashboard": "🏠", "/gyms": "🏢", "/employees": "👥", "/attendance": "🗓️", "/roster": "📅", "/leave": "🌴", "/payroll": "💰", "/advances": "💸", "/reports": "📊", "/users": "🔐", "/salary": "🧾", "/profile": "👤" };
  $("#nav").innerHTML = menu().map(([h, t]) => `<a href="#${h}" class="${path === h || (h !== "/dashboard" && path.startsWith(h)) ? "on" : ""}"><span class="ic">${IC[h] || "•"}</span><span>${esc(t)}</span></a>`).join("");
}

const routes = [];
const R = (re, fn) => routes.push([re, fn]);

async function route() {
  timers.forEach(clearInterval); timers = [];
  if (!S.user) return renderLogin();
  const [pathRaw, qs] = (location.hash.slice(1) || "/dashboard").split("?");
  const path = pathRaw || "/dashboard";
  const query = Object.fromEntries(new URLSearchParams(qs || ""));
  if (!$("#main")) renderShell();
  renderNav(path);
  const main = $("#main");
  for (const [re, fn] of routes) {
    const m = path.match(re);
    if (!m) continue;
    main.innerHTML = `<p class="mut">Loading…</p>`;
    try {
      const out = await fn(m.slice(1), query);
      if (location.hash.slice(1).split("?")[0] !== path && location.hash) { /* navigated away while loading */ }
      if (typeof out === "string") main.innerHTML = out;
      else if (out) { main.innerHTML = out.html; if (out.after) out.after(); }
    } catch (e) { main.innerHTML = `<div class="card err">Something went wrong: ${esc(errMsg(e))}</div>`; }
    return;
  }
  main.innerHTML = `<div class="card">Page not found. <a href="#/dashboard">Go home</a></div>`;
}

/* ---------- event wiring ---------- */
const H = {}; // action handlers
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("form[data-submit]"); if (!f) return;
  e.preventDefault();
  const btns = [...f.querySelectorAll("button")]; btns.forEach((b) => (b.disabled = true));
  try { await H[f.dataset.submit](new FormData(f), f, e.submitter); }
  catch (err) { toast(errMsg(err), true); const le = $("#loginErr"); if (le && f.dataset.submit === "signIn") le.textContent = errMsg(err); }
  finally { btns.forEach((b) => (b.disabled = false)); }
});
document.addEventListener("change", async (e) => {
  const el = e.target.closest("[data-change]"); if (!el) return;
  try { await H[el.dataset.change](el.dataset, el); } catch (err) { toast(errMsg(err), true); }
});
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-click]"); if (!b) return;
  try { await H[b.dataset.click](b.dataset, b); } catch (err) { toast(errMsg(err), true); }
});
window.addEventListener("hashchange", route);

H.filter = (fd, f) => { const p = new URLSearchParams(); for (const [k, val] of fd) if (val !== "") p.set(k, val); go(f.dataset.path + "?" + p); };
H.signIn = async (fd) => {
  const { error } = await sb.auth.signInWithPassword({ email: s(fd, "email"), password: s(fd, "password") });
  if (error) throw new Error("Wrong email or password");
  if (await loadSession()) { renderShell(); if (!location.hash) go("/dashboard"); route(); } else renderLogin();
};
H.signOut = async () => { await sb.auth.signOut(); S.user = null; location.hash = ""; renderLogin(); };

/* ================= shared data helpers ================= */
const gymsList = () => q(sb.from("gyms").select("id,code,name,is_active").order("name"));
const myEmployee = async () => (await q(sb.from("employees").select("id,gym_id,full_name,employee_code,joining_date,weekly_off,shift_id,device_id,designation,phone").eq("user_id", S.user.id).maybeSingle()));
const gymPicker = (gyms, cur, path, extra = {}) =>
  `<form class="inline" data-submit="filter" data-path="${path}">
    ${Object.entries(extra).map(([k, val]) => `<input type="hidden" name="${k}" value="${esc(val)}">`).join("")}
    ${field("Gym", sel("gym", gyms.map((g) => [g.id, g.name]), cur, 'onchange="this.form.requestSubmit()"'))}
    <noscript><button class="btn">Go</button></noscript></form>`;
const monthInput = (name, cur) => inp(name, { type: "month", value: cur, onchange: "this.form.requestSubmit()" });
const STATUS = ["present", "late", "half_day", "absent", "paid_leave", "unpaid_leave", "weekly_off", "holiday"];
const CODE = { present: "P", late: "L", half_day: "H", absent: "A", paid_leave: "PL", unpaid_leave: "UL", weekly_off: "W", holiday: "HD" };
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const deviceId = () => { try { let d = localStorage.getItem("gym_device"); if (!d) { d = crypto.randomUUID(); localStorage.setItem("gym_device", d); } return d; } catch { return "nodevice-" + navigator.userAgent.length; } };
const istStamp = (date, time) => (time ? `${date}T${time}:00+05:30` : null);
const table = (head, rows, empty = "Nothing here yet.") =>
  `<div class="card flush"><table><thead><tr>${head.map((h) => `<th${h.startsWith(">") ? ' class="right"' : ""}>${esc(h.replace(/^>/, ""))}</th>`).join("")}</tr></thead><tbody>${rows.length ? rows.join("") : `<tr><td colspan="${head.length}" class="mut">${esc(empty)}</td></tr>`}</tbody></table></div>`;

/* ================= dashboard ================= */
const PRESENT = ["present", "late", "half_day"];
const fmtDur = (ms) => `${Math.floor(ms / 36e5)}h ${String(Math.round((ms % 36e5) / 6e4)).padStart(2, "0")}m`;
const payStatus = (i) => (Number(i.paid_amount) >= Number(i.final_net) - 0.005 ? "Paid" : Number(i.paid_amount) > 0 ? "Partially paid" : "Unpaid");
const bars = (items) => {
  const max = Math.max(1, ...items.map((i) => i.value)), w = 44;
  return `<svg viewBox="0 0 ${items.length * w} 120" style="width:100%;max-width:460px;height:auto" role="img" aria-label="Chart">${items.map((it, i) => {
    const hh = Math.round((it.value / max) * 78);
    return `<rect x="${i * w + 6}" y="${96 - hh}" width="32" height="${hh}" rx="4" fill="var(--pri)"/><text x="${i * w + 22}" y="${90 - hh}" text-anchor="middle" font-size="10" fill="currentColor">${it.value}</text><text x="${i * w + 22}" y="112" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(it.label)}</text>`;
  }).join("")}</svg>`;
};
const statCard = (n, t, href, cls = "") => `<a class="card" style="text-decoration:none;color:inherit;margin:0" href="#${href}"><div class="num ${cls}">${n}</div><div class="small mut">${t}</div></a>`;

R(/^\/dashboard$/, async () => {
  const today = todayIST(), m = monthIST();
  if (isStaff()) {
    const e = await myEmployee();
    if (!e) return `<h1>Hello, ${esc(S.profile.full_name)}</h1><div class="card">Your login is not linked to an employee record yet. Ask your manager.</div>`;

async function runData(id) {
  const run = await q(sb.from("payroll_runs").select("*,gyms(name)").eq("id", id).single());
  const [items, emps, adjs, pays] = await Promise.all([
    q(sb.from("payroll_item_view").select("*").eq("run_id", id)),
    q(sb.from("employees").select("id,full_name,employee_code,designation").eq("gym_id", run.gym_id)),
    q(sb.from("payroll_adjustments").select("*").eq("run_id", id).order("created_at")),
    q(sb.from("payroll_payments").select("*").order("paid_on")),
  ]);
  const en = Object.fromEntries(emps.map((e) => [e.id, e]));
  items.sort((a, b) => (en[a.employee_id]?.full_name || "").localeCompare(en[b.employee_id]?.full_name || ""));
  return { run, items, en, adjs, pays };
}

/* ---- salary slip PDF ---- */
async function makeSlip(item, run, emp, gym, share) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdf = await PDFDocument.create(); const page = pdf.addPage([595, 842]);
  const f = await pdf.embedFont(StandardFonts.Helvetica), fb = await pdf.embedFont(StandardFonts.HelveticaBold);
  const green = rgb(0.016, 0.47, 0.34), grey = rgb(0.4, 0.4, 0.45), ink = rgb(0.1, 0.1, 0.12);
  const rs = (n) => "Rs. " + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const L = 40, Rr = 555; let y = 800;
  const txt = (t, x, size = 10, bold = false, color = ink) => page.drawText(String(t), { x, y, size, font: bold ? fb : f, color });
  const rtxt = (t, size = 10, bold = false, color = ink) => { const ft = bold ? fb : f; page.drawText(String(t), { x: Rr - ft.widthOfTextAtSize(String(t), size), y, size, font: ft, color }); };
  page.drawRectangle({ x: 0, y: 770, width: 595, height: 72, color: green });
  y = 812; page.drawText(gym.name || "Gym", { x: L, y, size: 20, font: fb, color: rgb(1, 1, 1) });
  y = 794; page.drawText([gym.address, gym.phone].filter(Boolean).join("  |  ").slice(0, 95), { x: L, y, size: 9, font: f, color: rgb(0.9, 1, 0.95) });
  y = 740; txt("SALARY SLIP", L, 14, true, green); rtxt(monthLabel(run.month), 12, true); y -= 28;
  const info = [["Employee", emp.full_name], ["Employee ID", emp.employee_code || ""], ["Designation", emp.designation || "-"], ["Gym", gym.name || ""]];
  info.forEach((r, i) => { const col = i % 2, row = Math.floor(i / 2); const x = col ? 310 : L, yy = y - row * 18; page.drawText(r[0] + ":", { x, y: yy, size: 9, font: f, color: grey }); page.drawText(String(r[1]), { x: x + 70, y: yy, size: 10, font: fb, color: ink }); });
  y -= 50;
  page.drawRectangle({ x: L, y: y - 8, width: Rr - L, height: 28, color: rgb(0.95, 0.96, 0.96) });
  txt(`Present ${item.present_days}   Late ${item.late_count}   Absent ${item.absent_units}   Paid leave ${item.paid_leave_days}   Unpaid leave ${item.unpaid_leave_days}   Month days ${dimFromDate(run.month)}`, L + 8, 9);
  y -= 40;
  const section = (title, rows, totalLabel, total) => {
    page.drawRectangle({ x: L, y: y - 6, width: Rr - L, height: 20, color: green }); txt(title, L + 8, 10, true, rgb(1, 1, 1)); y -= 26;
    rows.forEach(([a, b]) => { txt(a, L + 8); rtxt(rs(b)); y -= 18; });
    if (!rows.length) { txt("-", L + 8, 10, false, grey); y -= 18; }
    page.drawLine({ start: { x: L, y: y + 12 }, end: { x: Rr, y: y + 12 }, thickness: 0.5, color: grey });
    y -= 2; txt(totalLabel, L + 8, 10, true); rtxt(rs(total), 10, true); y -= 28;
  };
  const earn = [["Basic monthly salary", item.monthly_salary]];
  if (Number(item.overtime_amount)) earn.push([`Overtime (${item.overtime_hours} h)`, item.overtime_amount]);
  if (Number(item.incentive_amount)) earn.push(["Bonus / incentive", item.incentive_amount]);
  if (Number(item.adj_earning)) earn.push(["Adjustment (added)", item.adj_earning]);
  const gross = earn.reduce((a, r) => a + Number(r[1]), 0);
  const ded = [];
  if (Number(item.deduction_amount)) ded.push(["Absence / leave deduction", item.deduction_amount]);
  if (Number(item.advance_recovery)) ded.push(["Salary advance recovery", item.advance_recovery]);
  if (Number(item.adj_deduction)) ded.push(["Adjustment (deducted)", item.adj_deduction]);
  const dtotal = ded.reduce((a, r) => a + Number(r[1]), 0);
  section("EARNINGS", earn, "Gross earnings", gross);
  section("DEDUCTIONS", ded, "Total deductions", dtotal);
  page.drawRectangle({ x: L, y: y - 10, width: Rr - L, height: 34, color: rgb(0.93, 0.98, 0.95), borderColor: green, borderWidth: 1 });
  y += 2; txt("NET PAYABLE SALARY", L + 10, 12, true, green); rtxt(rs(item.final_net), 14, true, green); y -= 40;
  const status = payStatus(item);
  txt("Payment status: " + status + (Number(item.paid_amount) ? "  (paid " + rs(item.paid_amount) + ")" : ""), L, 10, true); y -= 60;
  txt("Generated on " + new Date().toLocaleDateString("en-IN"), L, 8, false, grey);
  page.drawText("Computer generated slip - no signature required.", { x: 330, y, size: 8, font: f, color: grey });
  const bytes = await pdf.save(); const name = `slip-${emp.full_name.replace(/\W+/g, "_")}-${run.month.slice(0, 7)}.pdf`;
  const blob = new Blob([bytes], { type: "application/pdf" });
  if (share && navigator.canShare) {
    const file = new File([blob], name, { type: "application/pdf" });
    if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Salary slip" }); return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function callAdmin(body) {
  const { data, error } = await sb.functions.invoke("team-admin", { body });
  if (error) {
    let m = error.message;
    try { const j = await error.context.json(); if (j?.error) m = j.error; } catch {}
    throw new Error(m);
  }
  if (data?.error) throw new Error(data.error);
  return data;
}

      ${gyms.map((g) => `<label style="display:block"><input type="checkbox" name="gym_${g.id}" ${have.has(g.id) ? "checked" : ""}> ${esc(g.name)}</label>`).join("")}
      <p class="small mut" style="margin-top:12px">Abilities:</p>
      ${PERMS.map(([k, t]) => `<label style="display:block"><input type="checkbox" name="${k}" ${mp?.[k] ? "checked" : ""}> ${esc(t)}</label>`).join("")}
      <div style="margin-top:12px"><button class="btn">Save</button></div></form>`;
  }
  return `<div class="row"><h1>${esc(u.full_name)}</h1><a class="btn ghost" href="#/users">Back</a></div>
  <div class="card"><div>${esc(u.email || "")}</div><div class="small mut">${ROLE[u.role]} · ${u.is_active ? "Active" : "Inactive"}</div></div>
  <div class="grid g2">
   <form class="card inline" data-submit="userPassword" data-id="${id}">${field("New password (min 8)", inp("password", { minlength: 8, required: true, autocomplete: "off" }))}<button class="btn">Set password</button></form>
   ${u.id !== S.user.id ? `<div class="card"><button class="btn ghost" data-click="userToggle" data-id="${id}" data-on="${u.is_active ? 0 : 1}">${u.is_active ? "Deactivate login" : "Reactivate login"}</button></div>` : ""}
  </div>${extra}`;
});
H.userPassword = async (fd, f) => { await callAdmin({ action: "set_password", user_id: f.dataset.id, id: f.dataset.id, password: s(fd, "password") }); toast("Password changed"); f.reset(); };
H.userToggle = async (d) => { await mut(sb.from("profiles").update({ is_active: d.on === "1" }).eq("id", d.id).select("id")); route(); };
H.mgrSave = async (fd, f) => {
  const id = f.dataset.id, gyms = await gymsList();
  const want = gyms.filter((g) => fd.get("gym_" + g.id) === "on").map((g) => g.id);
  const acc = await q(sb.from("manager_gym_access").select("gym_id").eq("user_id", id)); const have = new Set(acc.map((a) => a.gym_id));
  for (const g of gyms) {
    const w = want.includes(g.id), h = have.has(g.id);
    if (w && !h) await q(sb.from("manager_gym_access").insert({ user_id: id, gym_id: g.id }));
    if (!w && h) await q(sb.from("manager_gym_access").delete().eq("user_id", id).eq("gym_id", g.id));
  }
  const perms = Object.fromEntries(PERMS.map(([k]) => [k, fd.get(k) === "on"]));
  await mut(sb.from("manager_permissions").upsert({ user_id: id, ...perms }, { onConflict: "user_id" }).select("user_id"));
  toast("Saved");
};

/* ================= profile ================= */
R(/^\/profile$/, async () => {
  const e = isStaff() ? await myEmployee() : null;
  return `<h1>Profile</h1><div class="card"><b>${esc(S.profile.full_name)}</b><div class="small mut">${esc(S.user.email)} · ${ROLE[S.profile.role]}</div>
   ${e ? `<div class="small" style="margin-top:8px">Employee code ${esc(e.employee_code)}${e.designation ? " · " + esc(e.designation) : ""}</div>` : ""}</div>
  <h2>Change password</h2><form class="inline card" data-submit="myPassword">${field("New password (min 8)", inp("password", { type: "password", minlength: 8, required: true, autocomplete: "new-password" }))}<button class="btn">Change</button></form>`;
});
H.myPassword = async (fd, f) => { const { error } = await sb.auth.updateUser({ password: s(fd, "password") }); if (error) throw error; toast("Password changed"); f.reset(); };

/* ================= reports ================= */
const REPORTS = {
  daily: ["Daily attendance", ["date", "gym"]], monthly: ["Monthly attendance (employee-wise)", ["month", "gym"]], gymwise: ["Gym-wise attendance", ["month"]],
  late: ["Late arrivals", ["month", "gym"]], overtime: ["Overtime", ["month", "gym"]], payroll: ["Monthly payroll", ["month", "gym"]],
  payments: ["Salary payments (paid / pending)", ["month", "gym"]], leave: ["Leave report", ["month", "gym"]], advances: ["Outstanding advances", ["gym"]], employees: ["Employee list", ["gym"]],
};
async function buildReport(kind, p) {
  const m = p.month || monthIST(), d1 = m + "-01", d2 = m + "-" + dim(m);
  const gymF = (qb) => (p.gym ? qb.eq("gym_id", p.gym) : qb);
  const emps = await q(sb.from("employees").select("id,full_name,employee_code,gym_id,designation,phone,is_active,joining_date"));
  const en = Object.fromEntries(emps.map((e) => [e.id, e])); const gyms = await gymsList(); const gn = Object.fromEntries(gyms.map((g) => [g.id, g.name]));
  const nm = (id) => en[id]?.full_name || "";
  if (kind === "daily") {
    const date = p.date || todayIST(); const atts = await q(gymF(sb.from("attendance").select("*").eq("work_date", date)));
    const by = Object.fromEntries(atts.map((a) => [a.employee_id, a]));
    return { head: ["Employee", "Gym", "Status", "In", "Out", "Hours"], rows: emps.filter((e) => e.is_active && (!p.gym || e.gym_id === p.gym)).map((e) => { const a = by[e.id]; return [e.full_name, gn[e.gym_id], a ? label(a.status) : "Not marked", a ? timeIST(a.check_in) : "", a ? timeIST(a.check_out) : "", a?.check_in && a?.check_out ? fmtDur(new Date(a.check_out) - new Date(a.check_in)) : ""]; }) };
  }
  if (kind === "monthly" || kind === "late" || kind === "gymwise") {
    const atts = await q(gymF(sb.from("attendance").select("employee_id,gym_id,status,check_in,check_out,work_date").gte("work_date", d1).lte("work_date", d2)));
    if (kind === "gymwise") {
      const g = {}; atts.forEach((a) => { const o = (g[a.gym_id] ||= { p: 0, l: 0, h: 0, a: 0, lv: 0 }); if (a.status === "present") o.p++; else if (a.status === "late") o.l++; else if (a.status === "half_day") o.h++; else if (a.status === "absent") o.a++; else if (a.status.endsWith("leave")) o.lv++; });
      return { head: ["Gym", "Present", "Late", "Half day", "Absent", "Leave", "Attendance %"], rows: gyms.filter((x) => g[x.id]).map((x) => { const o = g[x.id], t = o.p + o.l + o.h + o.a + o.lv; return [x.name, o.p, o.l, o.h, o.a, o.lv, t ? Math.round(((o.p + o.l + o.h * 0.5) / t) * 100) + "%" : ""]; }) };
    }
    const c = {}; atts.forEach((a) => { const o = (c[a.employee_id] ||= { p: 0, l: 0, h: 0, a: 0, pl: 0, ul: 0, miss: 0 }); if (a.status === "present") o.p++; else if (a.status === "late") o.l++; else if (a.status === "half_day") o.h++; else if (a.status === "absent") o.a++; else if (a.status === "paid_leave") o.pl++; else if (a.status === "unpaid_leave") o.ul++; if (a.check_in && !a.check_out && a.work_date < todayIST()) o.miss++; });
    const ids = Object.keys(c).sort((x, y) => nm(x).localeCompare(nm(y)));
    if (kind === "late") return { head: ["Employee", "Gym", "Late days"], rows: ids.filter((i) => c[i].l).sort((x, y) => c[y].l - c[x].l).map((i) => [nm(i), gn[en[i]?.gym_id], c[i].l]) };
    return { head: ["Employee", "Gym", "Present", "Late", "Half day", "Absent", "Paid leave", "Unpaid leave", "Missing punch"], rows: ids.map((i) => [nm(i), gn[en[i]?.gym_id], c[i].p, c[i].l, c[i].h, c[i].a, c[i].pl, c[i].ul, c[i].miss]) };
  }
  if (kind === "payroll" || kind === "payments" || kind === "overtime") {
    const items = await q(gymF(sb.from("payroll_item_view").select("*").eq("month", d1)));
    const sorted = items.sort((a, b) => nm(a.employee_id).localeCompare(nm(b.employee_id)));
    if (kind === "overtime") return { head: ["Employee", "Gym", "OT hours", "OT amount"], rows: sorted.filter((i) => Number(i.overtime_hours)).map((i) => [nm(i.employee_id), gn[i.gym_id], i.overtime_hours, Number(i.overtime_amount)]) };
    if (kind === "payments") return { head: ["Employee", "Gym", "Net salary", "Paid", "Pending", "Status"], rows: sorted.map((i) => [nm(i.employee_id), gn[i.gym_id], Number(i.final_net), Number(i.paid_amount), Math.max(0, Number(i.final_net) - Number(i.paid_amount)), i.run_status === "draft" ? "Draft" : payStatus(i)]) };
    return { head: ["Employee", "Gym", "Salary", "Deduction", "Overtime", "Bonus", "Advance", "Adjust", "Net"], rows: sorted.map((i) => [nm(i.employee_id), gn[i.gym_id], Number(i.monthly_salary), Number(i.deduction_amount), Number(i.overtime_amount), Number(i.incentive_amount), Number(i.advance_recovery), Number(i.adj_earning) - Number(i.adj_deduction), Number(i.final_net)]) };
  }
  if (kind === "leave") {
    const ls = await q(gymF(sb.from("leave_requests").select("*").lte("from_date", d2).gte("to_date", d1).order("from_date")));
    return { head: ["Employee", "Gym", "From", "To", "Status", "Type", "Reason"], rows: ls.map((l) => [nm(l.employee_id), gn[l.gym_id], l.from_date, l.to_date, l.status, l.approved_type || "", l.reason || ""]) };
  }
  if (kind === "advances") {
    const [advs, recs] = await Promise.all([q(gymF(sb.from("advances").select("*").order("issued_on"))), sb.from("advance_recoveries").select("advance_id,amount")]);
    const rec = {}; (recs.data || []).forEach((r) => (rec[r.advance_id] = (rec[r.advance_id] || 0) + Number(r.amount)));
    return { head: ["Employee", "Gym", "Date", "Advance", "Recovered", "Balance"], rows: advs.map((a) => [nm(a.employee_id), gn[a.gym_id], a.issued_on, Number(a.amount), rec[a.id] || 0, Math.max(0, Number(a.amount) - (rec[a.id] || 0))]).filter((r) => r[5] > 0) };
  }
  return { head: ["Code", "Name", "Gym", "Designation", "Phone", "Joined", "Status"], rows: emps.filter((e) => !p.gym || e.gym_id === p.gym).map((e) => [e.employee_code, e.full_name, gn[e.gym_id], e.designation || "", e.phone || "", e.joining_date, e.is_active ? "Active" : "Inactive"]) };
}
let lastReport = null;
R(/^\/reports$/, async (_, qr) => {
  if (isStaff()) return go("/dashboard");
  const kind = REPORTS[qr.r] ? qr.r : "daily"; const need = REPORTS[kind][1]; const gyms = await gymsList();
  const rep = await buildReport(kind, qr); lastReport = { kind, ...rep, month: qr.month || monthIST() };
  const num = (x) => typeof x === "number";
  const money = /Salary|Deduction|Overtime|Bonus|Advance|Adjust|Net|Paid|Pending|Recovered|Balance|OT amount/;
  return `<div class="row"><h1>Reports</h1><div class="actions"><button class="btn ghost" data-click="repCsv">Download Excel (CSV)</button><button class="btn ghost" data-click="repPrint">Print / PDF</button></div></div>
  <form class="inline card" data-submit="filter" data-path="/reports">
    ${field("Report", sel("r", Object.entries(REPORTS).map(([k, x]) => [k, x[0]]), kind, 'onchange="this.form.requestSubmit()"'))}
    ${need.includes("gym") ? field("Gym", sel("gym", [["", "All gyms"], ...gyms.map((g) => [g.id, g.name])], qr.gym || "", 'onchange="this.form.requestSubmit()"')) : ""}
    ${need.includes("month") ? field("Month", monthInput("month", qr.month || monthIST())) : ""}
    ${need.includes("date") ? field("Date", inp("date", { type: "date", value: qr.date || todayIST(), onchange: "this.form.requestSubmit()" })) : ""}</form>
  <h2>${esc(REPORTS[kind][0])}</h2>
  <div class="card flush"><table><thead><tr>${rep.head.map((x) => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${rep.rows.map((r) => `<tr>${r.map((c, i) => `<td${num(c) ? ' class="right"' : ""}>${num(c) && money.test(rep.head[i]) ? inr(c) : esc(c)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${rep.head.length}" class="mut">No data for these filters (or you don't have permission to view it).</td></tr>`}</tbody></table></div>`;
});
H.repCsv = () => {
  if (!lastReport) return;
  const cell = (c) => '"' + String(c ?? "").replace(/"/g, '""') + '"';
  const csv = "﻿" + [lastReport.head, ...lastReport.rows].map((r) => r.map(cell).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `report-${lastReport.kind}-${lastReport.month}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
H.repPrint = () => window.print();

/* ================= duty roster ================= */
const addDays = (d, n) => new Date(new Date(d + "T00:00:00Z").getTime() + n * 864e5).toISOString().slice(0, 10);
const mondayOf = (d) => { const dt = new Date(d + "T00:00:00Z"); return addDays(d, -((dt.getUTCDay() + 6) % 7)); };
const dayHead = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en-IN", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short" });

R(/^\/roster$/, async (_, qr) => {
  if (isStaff()) return go("/attendance");
  const gyms = await gymsList(); const gid = qr.gym || gyms[0]?.id;
  if (!gid) return `<div class="card">No gyms yet.</div>`;
  const wk = mondayOf(qr.week || todayIST()); const days = Array.from({ length: 7 }, (_, i) => addDays(wk, i));
  const [emps, shifts, rows, hols] = await Promise.all([
    q(sb.from("employees").select("id,full_name,weekly_off,shift_id").eq("gym_id", gid).eq("is_active", true).order("full_name")),
    q(sb.from("shifts").select("id,name,start_time,end_time").eq("gym_id", gid).eq("is_active", true).order("start_time")),
    q(sb.from("roster").select("*").eq("gym_id", gid).gte("work_date", days[0]).lte("work_date", days[6])),
    q(sb.from("gym_holidays").select("holiday_date,name").eq("gym_id", gid).gte("holiday_date", days[0]).lte("holiday_date", days[6])),
  ]);
  const can = isAdmin() || S.perms.can_edit_attendance;
  const by = {}; rows.forEach((r) => (by[r.employee_id + r.work_date] = r));
  const holSet = new Set(hols.map((h) => h.holiday_date));
  const sn = Object.fromEntries(shifts.map((x) => [x.id, x]));
  const working = (e, d) => { const r = by[e.id + d]; if (r) return !r.is_off; return new Date(d + "T00:00:00Z").getUTCDay() !== e.weekly_off; };
  const defLabel = (e, d) => (new Date(d + "T00:00:00Z").getUTCDay() === e.weekly_off ? "Weekly off" : sn[e.shift_id]?.name || "No shift");
  const cell = (e, d) => {
    const r = by[e.id + d], cur = r ? (r.is_off ? "off" : r.shift_id) : "";
    if (!can) return r ? (r.is_off ? "Off" : esc(sn[r.shift_id]?.name || "Shift")) : `<span class="mut">${esc(defLabel(e, d))}</span>`;
    return `<select class="input" style="min-width:112px;padding:6px 26px 6px 8px;${r ? "border-color:var(--pri);background-color:var(--pri-soft)" : ""}" data-change="rosterSet" data-emp="${e.id}" data-gym="${gid}" data-date="${d}">
      ${opt("", "Default · " + defLabel(e, d), cur === "")}${opt("off", "Day off", cur === "off")}${shifts.map((x) => opt(x.id, `${x.name} ${x.start_time.slice(0, 5)}–${x.end_time.slice(0, 5)}`, cur === x.id)).join("")}</select>`;
  };
  return `<div class="row"><h1>Duty roster</h1>${can ? `<button class="btn ghost" data-click="rosterCopy" data-gym="${gid}" data-week="${wk}">Copy last week</button>` : ""}</div>
  <form class="inline" data-submit="filter" data-path="/roster">
    ${field("Gym", sel("gym", gyms.map((g) => [g.id, g.name]), gid, 'onchange="this.form.requestSubmit()"'))}
    ${field("Week starting", inp("week", { type: "date", value: wk, onchange: "this.form.requestSubmit()" }))}
    <a class="btn ghost" href="#/roster?gym=${gid}&week=${addDays(wk, -7)}">‹ Previous</a><a class="btn ghost" href="#/roster?gym=${gid}&week=${addDays(wk, 7)}">Next ›</a></form>
  <p class="small mut" style="margin:10px 0">Everyone follows their normal shift and weekly off unless you change a day here. Attendance (late marking), leave and payroll all follow the roster. ${shifts.length ? "" : '<b class="warn">Add shifts to the gym first.</b>'}</p>
  <div class="card flush"><table><thead><tr><th>Employee</th>${days.map((d) => `<th${holSet.has(d) ? ' title="Holiday"' : ""}>${dayHead(d)}${holSet.has(d) ? " 🎉" : ""}</th>`).join("")}</tr></thead><tbody>
  ${emps.map((e) => `<tr><td style="white-space:nowrap"><b>${esc(e.full_name)}</b></td>${days.map((d) => `<td>${cell(e, d)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="8" class="mut">No active employees.</td></tr>`}
  <tr><td class="small mut">Working that day</td>${days.map((d) => { const n = holSet.has(d) ? 0 : emps.filter((e) => working(e, d)).length; return `<td class="small ${n === 0 && !holSet.has(d) && emps.length ? "err" : ""}"><b>${n}</b>${n === 0 && !holSet.has(d) && emps.length ? " ⚠ nobody" : ""}</td>`; }).join("")}</tr>
  </tbody></table></div>`;
});
H.rosterSet = async (d, el) => {
  const val = el.value;
  try {
    if (val === "") await q(sb.from("roster").delete().eq("employee_id", d.emp).eq("work_date", d.date));
    else await q(sb.from("roster").upsert({ employee_id: d.emp, gym_id: d.gym, work_date: d.date, is_off: val === "off", shift_id: val === "off" ? null : val, created_by: S.user.id }, { onConflict: "employee_id,work_date" }));
    toast("Saved");
  } catch (e) { toast(errMsg(e), true); route(); }
};
H.rosterCopy = async (d) => {
  const prev = addDays(d.week, -7);
  const rows = await q(sb.from("roster").select("employee_id,gym_id,shift_id,is_off,work_date").eq("gym_id", d.gym).gte("work_date", prev).lte("work_date", addDays(prev, 6)));
  if (!rows.length) throw new Error("Last week has no changes to copy");
  await q(sb.from("roster").upsert(rows.map((r) => ({ ...r, work_date: addDays(r.work_date, 7), created_by: S.user.id })), { onConflict: "employee_id,work_date" }));
  toast("Copied"); route();
};

/* ================= boot ================= */
(async () => {
  try {
    if (await loadSession()) { renderShell(); await route(); } else renderLogin();
  } catch (e) { renderLogin("Could not connect: " + errMsg(e)); }
})();
</script>
